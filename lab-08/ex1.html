<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Marks Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 480px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 2rem;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #34495e;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }

    button:hover {
      background: #2980b9;
    }

    #result {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #ecf0f1;
      border-radius: 12px;
      display: none;
      text-align: center;
    }

    #result.show {
      display: block;
    }

    .result-title {
      font-size: 1.3rem;
      color: #2c3e50;
      margin-bottom: 1rem;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #27ae60;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Marks Calculator</h1>

    <div class="form-group">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="e.g. Arun" required />
    </div>

    <div class="form-group">
      <label for="mark1">Mark 1</label>
      <input type="number" id="mark1" min="0" max="100" placeholder="0–100" required />
    </div>

    <div class="form-group">
      <label for="mark2">Mark 2</label>
      <input type="number" id="mark2" min="0" max="100" placeholder="0–100" required />
    </div>

    <div class="form-group">
      <label for="mark3">Mark 3</label>
      <input type="number" id="mark3" min="0" max="100" placeholder="0–100" required />
    </div>

    <button onclick="calculateMarks()">Calculate</button>

    <div id="result">
      <div class="result-title">Result</div>
      <div class="result-value" id="nameOutput"></div>
      <div class="result-value" id="totalOutput"></div>
      <div class="result-value" id="avgOutput"></div>
    </div>
  </div>

  <script>
    // Arrow function to calculate average (ES6)
    const calculateAverage = (m1, m2, m3) => (m1 + m2 + m3) / 3;

    function calculateMarks() {
      const studentName = document.getElementById('studentName').value.trim() || "Student";

      const mark1 = Number(document.getElementById('mark1').value) || 0;
      const mark2 = Number(document.getElementById('mark2').value) || 0;
      const mark3 = Number(document.getElementById('mark3').value) || 0;

      const total = mark1 + mark2 + mark3;
      const average = calculateAverage(mark1, mark2, mark3);

      document.getElementById('nameOutput').textContent = `Student: ${studentName}`;
      document.getElementById('totalOutput').textContent = `Total Marks: ${total}`;
      document.getElementById('avgOutput').textContent = `Average: ${average.toFixed(2)}`;

      document.getElementById('result').classList.add('show');
    }
  </script>

</body>
</html>
