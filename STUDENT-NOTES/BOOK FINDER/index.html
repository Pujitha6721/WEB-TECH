<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Book Finder</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    color:#333;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.section{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.section h2{
    margin-top:0;
}

input{
    padding:10px;
    width:220px;
    border-radius:6px;
    border:1px solid #ccc;
    margin-right:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    background:#2575fc;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#174dcc;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

#bookContainer{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.book{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    text-align:center;
}

.book h3{
    margin:10px 0;
}

.book p{
    margin:5px 0;
    font-size:14px;
}

.book span{
    font-weight:bold;
    color:#2575fc;
}

</style>
</head>

<body>

<div class="container">

<h1>📚 Online Book Finder</h1>

<div class="section">
<h2>Search by Title</h2>
<input type="text" id="searchTitle" placeholder="Enter book title">
<button onclick="searchBook()">Search</button>
</div>

<div class="section">
<h2>Filter by Category</h2>
<input type="text" id="category" placeholder="Enter category">
<button onclick="filterCategory()">Filter</button>
</div>

<div class="section">
<h2>Sort Books</h2>
<div class="actions">
<button onclick="sortBooks('price')">Sort by Price</button>
<button onclick="sortBooks('rating')">Sort by Rating</button>
</div>
</div>

<div class="section">
<h2>Top Rated</h2>
<button onclick="topBooks()">Show Top Rated</button>
</div>

<div class="section">
<h2>Pagination</h2>
<div class="actions">
<button onclick="loadPage(1)">Page 1</button>
<button onclick="loadPage(2)">Page 2</button>
</div>
</div>

<h2 style="color:white">Books</h2>
<div id="bookContainer"></div>

</div>

<script src="script.js"></script>

</body>
</html>
