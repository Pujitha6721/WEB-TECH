<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Notes Manager</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:linear-gradient(120deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:30px;
}

h1{
color:white;
margin-bottom:20px;
}

/* Form Card */

.form-container{
background:white;
padding:25px;
border-radius:12px;
width:350px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
margin-bottom:30px;
}

.form-container h2{
margin-bottom:15px;
}

input, textarea{
width:100%;
padding:10px;
margin-bottom:12px;
border-radius:6px;
border:1px solid #ccc;
}

textarea{
resize:none;
height:80px;
}

button{
width:100%;
padding:10px;
border:none;
background:#667eea;
color:white;
border-radius:6px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

button:hover{
background:#5a67d8;
}

/* Notes Section */

.notes-section{
width:80%;
max-width:900px;
}

.notes-section h2{
color:white;
margin-bottom:15px;
}

#notesContainer{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

/* Note Card */

.note{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
transition:0.3s;
}

.note:hover{
transform:translateY(-5px);
}

.note h3{
margin-bottom:5px;
}

.subject{
font-size:13px;
color:#555;
margin-bottom:8px;
}

</style>
</head>

<body>

<h1>📒 Student Notes Manager</h1>

<div class="form-container">

<h2>Add Note</h2>

<input type="text" id="title" placeholder="Note Title">

<input type="text" id="subject" placeholder="Subject">

<textarea id="description" placeholder="Write your note..."></textarea>

<button onclick="addNote()">Add Note</button>

</div>

<div class="notes-section">

<h2>All Notes</h2>

<div id="notesContainer"></div>

</div>

<script src="script.js"></script>

</body>
</html>
