<!DOCTYPE html>
<html>
<head>
    <title>Weather Information Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1b5e20, #66bb6a);
        }

        .container {
            background: #ffffff;
            width: 400px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #1b5e20;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #a5d6a7;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 8px rgba(46,125,50,0.4);
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2e7d32, #43a047);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #1b5e20, #2e7d32);
            transform: translateY(-2px);
        }

        #spinner {
            margin-top: 18px;
            display: none;
            font-weight: bold;
            color: #2e7d32;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: #f1f8f4;
            min-height: 90px;
            transition: 0.3s;
        }

        #result h3 {
            margin-bottom: 10px;
            color: #1b5e20;
        }

        #result p {
            margin: 6px 0;
        }

        .error {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🌿 Weather Dashboard</h2>

    <div class="input-group">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <div id="spinner">Fetching weather data...</div>
    <div id="result"></div>
</div>

<script>
    let lastCity = "";
    let cachedWeather = null;

    function getWeather() {

        const city = document.getElementById("cityInput").value.trim();
        const resultDiv = document.getElementById("result");
        const spinner = document.getElementById("spinner");

        if (city === "") {
            resultDiv.innerHTML = "<p class='error'>Please enter a city name.</p>";
            return;
        }

        if (city.toLowerCase() === lastCity.toLowerCase() && cachedWeather) {
            displayWeather(cachedWeather);
            return;
        }

        spinner.style.display = "block";
        resultDiv.innerHTML = "";

        const apiKey = "43bfd525f7af1ba9781a1aa14aef2556";
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

        const xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);

        xhr.onload = function () {
            spinner.style.display = "none";

            if (xhr.status === 200) {

                const data = JSON.parse(xhr.responseText);

                if (data.cod !== 200) {
                    resultDiv.innerHTML = "<p class='error'>City not found!</p>";
                    return;
                }

                lastCity = city;
                cachedWeather = data;

                displayWeather(data);

            } else {
                resultDiv.innerHTML = "<p class='error'>Error fetching data.</p>";
            }
        };

        xhr.onerror = function () {
            spinner.style.display = "none";
            resultDiv.innerHTML = "<p class='error'>Network error occurred.</p>";
        };

        xhr.send();
    }

    function displayWeather(data) {

        const resultDiv = document.getElementById("result");

        const temperature = data.main.temp;
        const humidity = data.main.humidity;
        const condition = data.weather[0].description;
        const cityName = data.name;
        const country = data.sys.country;

        resultDiv.innerHTML = `
            <h3>${cityName}, ${country}</h3>
            <p><strong>Temperature:</strong> ${temperature} °C</p>
            <p><strong>Humidity:</strong> ${humidity}%</p>
            <p><strong>Condition:</strong> ${condition}</p>
        `;
    }
</script>

</body>
</html>
