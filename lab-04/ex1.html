<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Username Availability Checker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #134e5e, #71b280);
        }

        .container {
            background: #ffffff;
            padding: 35px;
            width: 360px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #1b5e20;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #a5d6a7;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 6px rgba(46, 125, 50, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #2e7d32, #43a047);
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #1b5e20, #2e7d32);
        }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

        .loading {
            color: #388e3c;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Create Account</h2>

    <form id="registerForm">
        <input type="text" id="username" placeholder="Enter username" required>
        <button type="submit">Register</button>
    </form>

    <div id="feedback"></div>
</div>

<script src="script.js"></script>

</body>
</html>
