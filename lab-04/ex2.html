<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Finder</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1b5e20, #66bb6a);
        display: flex;
        justify-content: center;
        padding: 50px 20px;
        min-height: 100vh;
    }

    .app {
        width: 100%;
        max-width: 600px;
        background: #ffffff;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    .app h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #1b5e20;
    }

    .search-area {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .search-area input {
        flex: 1;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #a5d6a7;
        font-size: 15px;
        transition: 0.3s;
    }

    .search-area input:focus {
        border-color: #2e7d32;
        box-shadow: 0 0 8px rgba(46, 125, 50, 0.4);
        outline: none;
    }

    #message {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
        color: #2e7d32;
    }

    .product-card {
        background: #f1f8f4;
        border-radius: 12px;
        padding: 18px;
        margin-top: 14px;
        border-left: 6px solid #43a047;
        transition: 0.3s;
    }

    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .product-card h3 {
        margin-bottom: 6px;
        color: #1b5e20;
    }

    .product-card span {
        display: block;
        font-size: 14px;
        color: #444;
        margin-bottom: 3px;
    }

    .price {
        margin-top: 8px;
        font-weight: bold;
        color: #2e7d32;
        font-size: 15px;
    }

</style>
</head>

<body>

<div class="app">
    <h1>🌿 Product Finder</h1>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search by product name...">
    </div>

    <div id="message"></div>
    <div id="results"></div>
</div>

<script src="productFinder.js"></script>

</body>
</html>
