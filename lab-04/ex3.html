<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #1b5e20, #66bb6a);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #a5d6a7;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 6px rgba(46,125,50,0.4);
            outline: none;
        }

        .btn-group {
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 9px 16px;
            margin: 5px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            font-weight: bold;
        }

        .add-btn {
            background: #2e7d32;
            color: white;
        }

        .update-btn {
            background: #43a047;
            color: white;
        }

        .edit-btn {
            background: #81c784;
            color: black;
        }

        .delete-btn {
            background: #c62828;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #2e7d32;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f1f8f4;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>🌿 Student Management System (AJAX CRUD)</h2>

<div class="container">

    <!-- Form -->
    <div class="form-group">
        <input type="text" id="id" placeholder="Student ID">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="dept" placeholder="Department">
        <input type="number" id="marks" placeholder="Marks">
    </div>

    <div class="btn-group">
        <button class="add-btn" onclick="addStudent()">Add</button>
        <button class="update-btn" onclick="updateStudent()">Update</button>
    </div>

    <div class="message" id="message"></div>

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

</div>

<script>
const API_URL = "http://localhost:3000/students";

function showMessage(msg, isError = false) {
    const messageDiv = document.getElementById("message");
    messageDiv.innerText = msg;
    messageDiv.style.color = isError ? "#c62828" : "#2e7d32";
}

function fetchStudents() {
    fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            const table = document.getElementById("studentTable");
            table.innerHTML = "";

            data.forEach(student => {
                table.innerHTML += `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.department}</td>
                        <td>${student.marks}</td>
                        <td>
                            <button class="edit-btn" onclick="editStudent('${student.id}','${student.name}','${student.department}','${student.marks}')">Edit</button>
                            <button class="delete-btn" onclick="deleteStudent('${student.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        });
}

function addStudent() {
    const student = {
        id: id.value,
        name: name.value,
        department: dept.value,
        marks: marks.value
    };

    fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
    }).then(() => {
        showMessage("Student Added Successfully");
        fetchStudents();
    });
}

function updateStudent() {
    const student = {
        id: id.value,
        name: name.value,
        department: dept.value,
        marks: marks.value
    };

    fetch(`${API_URL}/${student.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
    }).then(() => {
        showMessage("Student Updated Successfully");
        fetchStudents();
    });
}

function deleteStudent(id) {
    fetch(`${API_URL}/${id}`, { method: "DELETE" })
        .then(() => {
            showMessage("Student Deleted Successfully");
            fetchStudents();
        });
}

function editStudent(idVal, nameVal, deptVal, marksVal) {
    id.value = idVal;
    name.value = nameVal;
    dept.value = deptVal;
    marks.value = marksVal;
}

fetchStudents();
</script>

</body>
</html>
